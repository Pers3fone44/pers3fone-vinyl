
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pers3fone | Vinyl Experience</title>
<style>
:root {
  color-scheme: dark;
  font-family: Georgia, serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  color: #eee7df;
  background: radial-gradient(ellipse at 50% 25%, #342c30, #100e11 75%);
  transition: background 1.5s;
}
body.side-b {
  background: radial-gradient(ellipse at 50% 25%, #34234e, #100d20 75%);
}
header {
  display: flex;
  justify-content: space-between;
  padding: 25px 7%;
  border-bottom: 1px solid #ffffff20;
}
.logo { font-size: 23px; letter-spacing: 3px; }
.small { font: 11px Arial; letter-spacing: 2px; color: #b4a9a8; }
main {
  max-width: 1000px;
  margin: auto;
  padding: 45px 20px;
  text-align: center;
}
h1 { font-weight: normal; letter-spacing: 5px; }
.subtitle { color: #aaa0a2; }
.turntable {
  position: relative;
  width: min(85vw, 420px);
  aspect-ratio: 1;
  margin: 35px auto;
  padding: 8%;
  border: 8px solid #382d2b;
  border-radius: 18px;
  background: linear-gradient(135deg, #493d3a, #211c1f);
  box-shadow: 0 25px 70px #000a, inset 0 0 25px #0008;
}
.record {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  position: relative;
  background: repeating-radial-gradient(circle,
    #101013 0px, #101013 3px,
    #242327 4px, #111114 6px);
  box-shadow: 0 5px 18px #000b;
}
.record.spinning { animation: spin 2s linear infinite; }
.label {
  position: absolute;
  inset: 35%;
  border-radius: 50%;
  background: #6c4545;
  display: grid;
  place-items: center;
  font: bold 13px Arial;
  letter-spacing: 2px;
}
body.side-b .label { background: #55417b; }
.label::after {
  content: "";
  width: 7px;
  height: 7px;
  background: #d9d0c5;
  border-radius: 50%;
  position: absolute;
}
@keyframes spin { to { transform: rotate(360deg); } }
.arm {
  position: absolute;
  width: 9px;
  height: 43%;
  right: 13%;
  top: 7%;
  background: linear-gradient(90deg,#999,#ddd,#666);
  border-radius: 10px;
  transform-origin: top center;
  transform: rotate(-24deg);
  transition: transform 0.7s;
  box-shadow: 2px 2px 5px #000;
}
.arm.playing { transform: rotate(7deg); }
.controls { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
button {
  background: transparent;
  border: 1px solid #a28e86;
  color: #eee7df;
  padding: 13px 20px;
  cursor: pointer;
  letter-spacing: 1px;
}
button:hover { background: #ffffff19; }
.tracklist {
  margin: 35px auto;
  max-width: 550px;
  text-align: left;
}
.track {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 16px;
  border-bottom: 1px solid #ffffff20;
  font: 14px Arial;
}
.locked { opacity: 0.4; }
footer {
  padding: 35px 15px;
  text-align: center;
  color: #a99fa1;
  font: 12px Arial;
}
</style>
</head>
<body>
<header>
  <div class="logo">pers3fone</div>
  <div class="small">VINYL EXPERIENCE</div>
</header>

<main>
  <p class="small">UNA EXPERIENCIA MUSICAL INTERACTIVA</p>
  <h1>EL ÁLBUM</h1>
  <p class="subtitle">Dos caras. Un mismo viaje.</p>

  <div class="turntable">
    <div class="record" id="record">
      <div class="label" id="label">A</div>
    </div>
    <div class="arm" id="arm"></div>
  </div>

  <div class="controls">
    <button id="play">▶ Activar tocadiscos</button>
    <button id="flip">↻ Girar vinilo</button>
  </div>

  <p class="subtitle" id="status" aria-live="polite">
    El vinilo está esperando.
  </p>

  <section class="tracklist">
    <h2 id="sideTitle">CARA A — OSCURIDAD</h2>
    <div id="tracks"></div>
  </section>
</main>

<footer>
  <p>Una experiencia de pers3fone</p>
  <p>Escucha con auriculares para una experiencia completa.</p>
  <p>Apoyo voluntario disponible próximamente.</p>
</footer>

<script>
const sides = {
  A: [
    ["Anomia", true],
    ["Calma", true],
    ["Premonición", true],
    ["Pista por revelar", false],
    ["Pista por revelar", false],
    ["Pista por revelar", false],
    ["Pista por revelar", false]
  ],
  B: [
    ["Sueños de Neón", true],
    ["No va a volver", false],
    ["Pista por revelar", false],
    ["Pista por revelar", false],
    ["Pista por revelar", false]
  ]
};

let side = "A";
let playing = false;

const record = document.getElementById("record");
const arm = document.getElementById("arm");
const play = document.getElementById("play");
const flip = document.getElementById("flip");
const status = document.getElementById("status");
const tracks = document.getElementById("tracks");

function render() {
  document.body.classList.toggle("side-b", side === "B");
  document.getElementById("label").textContent = side;
  document.getElementById("sideTitle").textContent =
    side === "A" ? "CARA A — OSCURIDAD" : "CARA B — LUZ";

  tracks.replaceChildren();
  sides[side].forEach(([name, available], index) => {
    const row = document.createElement("div");
    row.className = "track" + (available ? "" : " locked");

    const title = document.createElement("span");
    title.textContent = String(index + 1).padStart(2, "0") + " · " + name;

    const state = document.createElement("span");
    state.textContent = available ? "Disponible" : "Próximamente";

    row.append(title, state);
    tracks.append(row);
  });
}

play.addEventListener("click", () => {
  playing = !playing;
  record.classList.toggle("spinning", playing);
  arm.classList.toggle("playing", playing);
  play.textContent = playing ? "Ⅱ Detener tocadiscos" : "▶ Activar tocadiscos";
  status.textContent = playing
    ? "El vinilo está girando. Selecciona una canción cuando integremos el audio."
    : "El vinilo está esperando.";
});

flip.addEventListener("click", () => {
  side = side === "A" ? "B" : "A";
  playing = false;
  record.classList.remove("spinning");
  arm.classList.remove("playing");
  play.textContent = "▶ Activar tocadiscos";
  status.textContent = "Has cambiado a la Cara " + side + ".";
  render();
});

render();
</script>
</body>
</html>
